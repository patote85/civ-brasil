<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Atlas hexagonal de São Paulo em linguagem de Civilization: 1.091 hexes H3, 645 municípios, 11 lentes e 14 fontes públicas oficiais."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="civ-brasil — São Paulo em linguagem de Civilization" />
    <meta
      property="og:description"
      content="1.091 hexágonos H3 res 5, 645 municípios, 11 lentes temáticas, City View e Explorer com dados públicos oficiais."
    />
    <meta property="og:image" content="/og-sp.svg" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='%23d4a226' stroke='%230a1019' stroke-width='2'/%3E%3C/svg%3E" />
    <title>civ-brasil — São Paulo em linguagem de Civilization</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>civ-brasil</h1>
          <span class="subtitle">São Paulo · H3 res 5</span>
        </div>
        <div id="yields-bar" class="yields-bar" aria-label="Totais estaduais"></div>
        <div class="top-actions">
          <button id="btn-search" class="action-btn" type="button" title="Buscar município (/)">
            Buscar <kbd>/</kbd>
          </button>
          <button id="btn-explorer" class="action-btn" type="button" title="Abrir Explorer 645 municípios (E)">
            Explorer <kbd>E</kbd>
          </button>
          <button id="btn-almanac" class="action-btn" type="button" title="Almanaque, UF View e Fontes Oficiais">
            Fontes
          </button>
          <button id="btn-mode" class="action-btn" type="button" title="Alternar modo visual (M)">
            Modo: Atlas
          </button>
          <button id="btn-banners" class="action-btn" type="button" title="Mostrar ou ocultar cidades">
            Cidades: ON
          </button>
          <button id="btn-points" class="action-btn" type="button" title="Camada de pontos (usinas, portos, hospitais)">
            Pontos: AUTO
          </button>
          <button id="btn-share" class="action-btn" type="button" title="Copiar link compartilhável do estado atual">
            Compartilhar
          </button>
          <button id="btn-png" class="action-btn" type="button" title="Baixar captura 1600×900">
            PNG
          </button>
        </div>
      </header>

      <nav class="lensbar" aria-label="Seletor de lentes">
        <div id="lens-buttons" class="lens-buttons" role="tablist"></div>
        <div class="lensbar-right">
          <div id="status" class="status" role="status" aria-live="polite">
            Carregando base de São Paulo…
          </div>
          <button id="btn-reset" class="action-btn" type="button">Resetar</button>
        </div>
      </nav>

      <main class="map-stage">
        <div id="map-container" class="map-container">
          <canvas id="map-canvas" aria-label="Mapa hexagonal de São Paulo"></canvas>
        </div>
        <div id="tooltip" class="tooltip hidden" role="tooltip"></div>
        <aside id="legend" class="legend" aria-label="Legenda da lente ativa"></aside>
        <aside id="city-drawer" class="city-drawer hidden" aria-label="City View do município"></aside>
        <div id="minimap-box" class="minimap-box">
          <canvas id="minimap-canvas" width="150" height="105" aria-label="Minimapa de São Paulo"></canvas>
        </div>
      </main>
    </div>

    <div id="search-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Buscar município">
      <div class="modal-card">
        <div class="modal-header">
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            placeholder="Buscar entre os 645 municípios de SP (ex.: São José dos Campos)…"
          />
          <button id="btn-close-search" class="action-btn" type="button">Esc</button>
        </div>
        <ul id="search-results" class="search-results"></ul>
      </div>
    </div>

    <div id="explorer-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Explorer de municípios"></div>
    <div id="almanac-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Almanaque e Fontes Oficiais"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
