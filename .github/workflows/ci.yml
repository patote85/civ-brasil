name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup
        run: make setup

      - name: Check
        run: make check

      - name: Web build
        run: make web-build

      - name: Verify
        run: make verify

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: make e2e
